name: CI/CD Pipeline - Test, Package & Deploy to AWS EC2

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ============================================================================
  # STAGE 1: Code Validation, Linting & Automated Unit Tests
  # ============================================================================
  test-and-validate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js Runtime with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'backend/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Run Jest Unit Tests
        run: pnpm test


  # ============================================================================
  # STAGE 2: DevSecOps Secret & Vulnerability Scanning (Question 3)
  # ============================================================================
  security-scan:
    name: DevSecOps Vulnerability & Secret Scan
    runs-on: ubuntu-latest
    needs: test-and-validate
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Scan Repository for Leaked Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      

  # ============================================================================
  # STAGE 2: Build Application & Package Docker Container
  # ============================================================================
  build-and-package:
    name: Build & Package Docker Image
    runs-on: ubuntu-latest
    needs: test-and-validate
    outputs:
      image_uri: ${{ steps.image_info.outputs.image_uri }}
      image_tag: ${{ steps.image_info.outputs.image_tag }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image URI Metadata
        id: image_info
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}"
          TAG="${{ github.sha }}"
          echo "image_uri=${IMAGE}" >> $GITHUB_OUTPUT
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image_info.outputs.image_uri }}:${{ steps.image_info.outputs.image_tag }}
            ${{ steps.image_info.outputs.image_uri }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Container Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image_info.outputs.image_uri }}:${{ steps.image_info.outputs.image_tag }}
          scan-type: 'image'
          severity: 'CRITICAL'
          exit-code: '0'

  # ============================================================================
  # STAGE 3: Automated Deployment to AWS EC2
  # ============================================================================
  deploy-to-aws-ec2:
    name: Deploy to AWS EC2 & Verify Health
    runs-on: ubuntu-latest
    needs: build-and-package
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Container to AWS EC2 via SSH
        id: deploy_step
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=========================================================="
            echo "🚀 Deploying Image: ${{ needs.build-and-package.outputs.image_uri }}:${{ needs.build-and-package.outputs.image_tag }}"
            echo "=========================================================="
            # Log into GHCR on EC2
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Pull the newly built image
            docker pull ${{ needs.build-and-package.outputs.image_uri }}:${{ needs.build-and-package.outputs.image_tag }}
            # Track previous version for automated rollback
            STATE_FILE="$HOME/.deploy_state.json"
            PREV_IMAGE=$(docker ps --filter "name=devops-ticket-api" --format "{{.Image}}" || echo "none")
            cat <<EOF > "$STATE_FILE"
            {
              "previous_image": "${PREV_IMAGE}",
              "active_image": "${{ needs.build-and-package.outputs.image_uri }}:${{ needs.build-and-package.outputs.image_tag }}",
              "commit_sha": "${{ needs.build-and-package.outputs.image_tag }}",
              "deployed_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            }
            EOF
            # Stop and remove older container
            docker stop devops-ticket-api || true
            docker rm devops-ticket-api || true
            # Run new container
            docker run -d \
              --name devops-ticket-api \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e APP_VERSION=1.0.0 \
              -e COMMIT_SHA=${{ needs.build-and-package.outputs.image_tag }} \
              ${{ needs.build-and-package.outputs.image_uri }}:${{ needs.build-and-package.outputs.image_tag }}
            echo "✅ Container started successfully on port 3000"
            sleep 3
            echo "=========================================================="
            echo "🔍 EC2 Live Diagnostics:"
            echo "--- Docker Containers ---"
            docker ps -a
            echo "--- Container Logs ---"
            docker logs --tail 30 devops-ticket-api
            echo "--- Local Curl Test on EC2 ---"
            curl -sS http://127.0.0.1:3000/health || echo "Local curl on EC2 failed"
            echo "=========================================================="

      # Automated failure detection (Question 2)
      - name: Verify Post-Deployment Health & Version
        id: health_check
        run: |
          echo "=========================================================="
          echo "🩺 Polling AWS EC2 Health: http://${{ secrets.EC2_HOST }}:3000/health"
          echo "=========================================================="
          ATTEMPT=1
          MAX_ATTEMPTS=15
          SUCCESS=false
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Probing health endpoint..."
            if curl -sSf "http://${{ secrets.EC2_HOST }}:3000/health" > /dev/null 2>&1; then
              SUCCESS=true
              break
            fi
            sleep 2
            ATTEMPT=$((ATTEMPT + 1))
          done
          if [ "$SUCCESS" = true ]; then
            echo "✅ Service responded with HTTP 200 OK!"
            echo "🔍 Release details from /version:"
            curl -s "http://${{ secrets.EC2_HOST }}:3000/version"
            echo ""
            echo "🎉 Deployment Verified! Live Swagger API Docs:"
            echo "👉 http://${{ secrets.EC2_HOST }}:3000/api/docs"
          else
            echo "❌ Health check failed after $MAX_ATTEMPTS attempts!"
            exit 1
          fi

      # Automated rollback if health check fails (Question 2)
      - name: Automatic Rollback on Health Failure
        if: failure() && steps.deploy_step.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=========================================================="
            echo "⚠️ Health check failed! Initiating immediate rollback..."
            echo "=========================================================="
            STATE_FILE="$HOME/.deploy_state.json"
            PREV_IMAGE=$(grep -o '"previous_image": "[^"]*' "$STATE_FILE" | cut -d'"' -f4 || echo "none")
            if [ "$PREV_IMAGE" != "none" ] && [ -n "$PREV_IMAGE" ]; then
              echo "Restoring previous stable container: $PREV_IMAGE"
              docker stop devops-ticket-api || true
              docker rm devops-ticket-api || true
              docker run -d --name devops-ticket-api --restart unless-stopped -p 3000:3000 "$PREV_IMAGE"
              echo "✅ Successfully rolled back to $PREV_IMAGE"
            else
              echo "No previous stable image recorded to rollback to."
            fi
