name: CI Pipeline - Build & Validate
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read


jobs:

  # STAGE 1: Code Validation, Linting & Automated Unit Tests
  test-and-validate:

    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js Runtime with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'backend/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Run Jest Unit Tests
        run: pnpm test

  # STAGE 2: Build Application & Package Docker Container

  build-and-package:
    name: Build & Package Docker Image
    runs-on: ubuntu-latest

    needs: test-and-validate

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: devops-ticket-manager-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Report Build Success
        run: |
          echo "=========================================================="
          echo "🎉 Pipeline Completed Successfully!"
          echo "✅ Unit tests: PASSED"
          echo "✅ Docker image build: PASSED"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Timestamp:  $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "=========================================================="